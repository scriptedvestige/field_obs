{% extends "base.html" %}

{% block title %}Treatment Log{% endblock %}

{% block content %}
    <h1>Treatment Event Log</h1>
    <form id="treatment_form" method="POST" action="/treatment">

        <fieldset>
            <legend>Zone</legend>
            <label><input type="checkbox" name="zones" value="cab_sauv"> Cab Sauv</label><br>
            <label><input type="checkbox" name="zones" value="merlot"> Merlot</label><br>
            <label><input type="checkbox" name="zones" value="riesling"> Riesling</label><br>
            <label><input type="checkbox" name="zones" value="northeast_roses"> Northeast Roses</label><br>
            <label><input type="checkbox" name="zones" value="northwest_roses"> Northwest Roses</label><br>
            <label><input type="checkbox" name="zones" value="southeast_roses"> Southeast Roses</label><br>
            <label><input type="checkbox" name="zones" value="southwest_roses"> Southwest Roses</label>
        </fieldset>
        <br>

        <label>Treatment Type:
            <select name="treatment_type" required>
                <option value="" disabled selected>Select Type</option>
                <option value="beneficial_insects">Beneficial Insects</option>
                <option value="pesticide">Pesticide</option>
                <option value="fungicide">Fungicide</option>
                <option value="herbicide">Herbicide</option>
                <option value="other">Other</option>
            </select>
        </label>
        <br>

        <label>Product / Organism:
            <input type="text" name="product_name" required>
        </label>
        <br>

        <label>Target Pest / Disease:
            <input type="text" name="target" placeholder="-- Optional --">
        </label>
        <br>

        <label>Amount:
            <input type="number" step="0.1" name="amount" id="amount_input">
        </label>
        <br>

        <label>Unit:
            <select name="amount_unit">
                <option value="">-- Optional --</option>
                <option value="cups">Cups</option>
                <option value="tbsp">Tbsp</option>
                <option value="oz">Oz</option>
                <option value="lbs">Lbs</option>
                <option value="ml">mL</option>
                <option value="g">g</option>
                <option value="count">Count</option>
            </select>
        </label>
        <br>

        <label>Application Method:
            <select name="application_method">
                <option value="">-- Optional --</option>
                <option value="release">Release</option>
                <option value="spray">Spray</option>
                <option value="granular">Granular</option>
                <option value="drip">Drip</option>
                <option value="foliar_spray">Foliar Spray</option>
            </select>
        </label>
        <br>

        <label>Notes:
            <input type="text" name="notes">
        </label>
        <br>

        <button type="submit">Log Event</button>
    </form>
{% endblock %}

{% block back_link %}
    <a href="{{ url_for('menu') }}">Back to Menu</a>
{% endblock %}
