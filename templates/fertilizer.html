{% extends "base.html" %}

{% block title %}Fertilizer Log{% endblock %}

{% block content %}
    <h1>Fertilizer Event Log</h1>
    <form id="fertilizer_form" method="POST" action="/fertilizer">

        <label>Zone:
            <select name="zone" required>
                <option value="" disabled selected>Select Zone</option>
                <option value="cab_sauv">Cab Sauv</option>
                <option value="merlot">Merlot</option>
                <option value="riesling">Riesling</option>
                <option value="northeast_roses">Northeast Roses</option>
                <option value="northwest_roses">Northwest Roses</option>
                <option value="southeast_roses">Southeast Roses</option>
                <option value="southwest_roses">Southwest Roses</option>
            </select>
        </label>
        <br>

        <label>Fertilizer Name:
            <input type="text" name="fertilizer_name" required>
        </label>
        <br>

        <label>Amount:
            <input type="number" step="0.1" name="amount" id="amount_input">
        </label>
        <br>

        <label>Unit:
            <select name="amount_unit">
                <option value="">-- Optional --</option>
                <option value="cups">Cups</option>
                <option value="tbsp">Tbsp</option>
                <option value="oz">Oz</option>
                <option value="lbs">Lbs</option>
                <option value="ml">mL</option>
                <option value="g">g</option>
            </select>
        </label>
        <br>

        <label>Application Method:
            <select name="application_method">
                <option value="">-- Optional --</option>
                <option value="granular">Granular</option>
                <option value="liquid">Liquid</option>
                <option value="foliar_spray">Foliar Spray</option>
                <option value="drip">Drip</option>
            </select>
        </label>
        <br>

        <fieldset id="nutrient_section">
            <legend>Nutrients</legend>
            <label><input type="radio" name="nutrient_mode" value="freetext" onchange="toggleNutrients()"> Freetext</label>
            <label><input type="radio" name="nutrient_mode" value="npk" onchange="toggleNutrients()"> N-P-K</label>

            <div id="freetext_fields" style="display:none;">
                <br>
                <label>Nutrients:
                    <input type="text" name="nutrients" id="nutrients_input" placeholder="e.g. 4-4-4, nitrogen, etc.">
                </label>
            </div>

            <div id="npk_fields" style="display:none;">
                <br>
                <label>Nitrogen (N):
                    <input type="number" step="0.1" name="nitrogen" id="nitrogen_input">
                </label>
                <br>
                <label>Phosphorus (P):
                    <input type="number" step="0.1" name="phosphorus" id="phosphorus_input">
                </label>
                <br>
                <label>Potassium (K):
                    <input type="number" step="0.1" name="potassium" id="potassium_input">
                </label>
            </div>
        </fieldset>
        <br>

        <label>Notes:
            <input type="text" name="notes">
        </label>
        <br>

        <button type="submit">Log Event</button>
    </form>
{% endblock %}

{% block back_link %}
    <a href="{{ url_for('menu') }}">Back to Menu</a>
{% endblock %}

{% block scripts %}
<script>
    function toggleNutrients() {
        const mode = document.querySelector('input[name="nutrient_mode"]:checked').value;

        const freetextFields = document.getElementById("freetext_fields");
        const npkFields = document.getElementById("npk_fields");

        if (mode === "freetext") {
            freetextFields.style.display = "block";
            npkFields.style.display = "none";
            document.getElementById("nitrogen_input").value = "";
            document.getElementById("phosphorus_input").value = "";
            document.getElementById("potassium_input").value = "";
        } else if (mode === "npk") {
            npkFields.style.display = "block";
            freetextFields.style.display = "none";
            document.getElementById("nutrients_input").value = "";
        }
    }
</script>
{% endblock %}
