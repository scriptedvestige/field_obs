{% extends "base.html" %}

{% block title %}Hydration Log{% endblock %}

{% block content %}
    <h1>Hydration Event Log</h1>
    <form id="hydration_form" method="POST" action="/hydration">

        <label>Consumed At:
            <input type="datetime-local" name="consumed_at" id="consumed_at" required>
        </label>
        <br>

        <label>Beverage:
            <select name="beverage_type" required>
                <option value="" disabled selected>Select Beverage</option>
                <option value="protein_shake">Protein Shake</option>
                <option value="water">Water</option>
                <option value="sports_drink">Sports Drink</option>
                <option value="coffee">Coffee</option>
                <option value="tea">Tea</option>
                <option value="milk">Milk</option>
                <option value="soda">Soda</option>
                <option value="alcohol">Alcohol</option>
            </select>
        </label>
        <br>

        <label>Volume (oz):
            <div>
                <button type="button" onclick="setOz(8)">8oz</button>
                <button type="button" onclick="setOz(12)">12oz</button>
                <button type="button" onclick="setOz(14)">14oz</button>
                <button type="button" onclick="setOz(20)">20oz</button>
                <button type="button" onclick="setOz(26)">26oz</button>
                <button type="button" onclick="setOz(28)">28oz</button>
            </div>
            <input type="number" step="0.1" name="volume_oz" id="volume_oz" min="0.1" required>
        </label>
        <br>

        <label>Notes:
            <input type="text" name="notes">
        </label>
        <br>

        <button type="submit">Log Event</button>
    </form>
{% endblock %}

{% block back_link %}
    <a href="{{ url_for('menu') }}">Back to Menu</a>
{% endblock %}

{% block scripts %}
<script>
    function setOz(amount) {
        document.getElementById('volume_oz').value = amount;
    }
</script>
{% endblock %}
